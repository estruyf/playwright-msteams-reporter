name: Release

on:
  push:
    branches:
      - dev
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:jest

  release:
    runs-on: ubuntu-latest
    needs: test
    # Beta releases from dev, stable releases from GitHub releases or main
    if: github.ref == 'refs/heads/dev' || github.event_name == 'release' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    env:
      IS_BETA: ${{ github.ref == 'refs/heads/dev' }}
    steps:
      - uses: actions/checkout@v7
      # Node 24 ships with npm 11.5.1+, which is required for trusted publishing
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install npm dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Update the package version
        if: env.IS_BETA == 'true'
        run: node scripts/update-package-version.js $GITHUB_RUN_ID

      - name: Publish beta release
        if: env.IS_BETA == 'true'
        run: npm publish --tag next --access public

      - name: Publish release
        if: env.IS_BETA != 'true'
        run: npm publish --access public
